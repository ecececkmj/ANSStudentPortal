<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Portal - Login</title>
    <link rel="icon" href="{{ url_for('static', filename='fabicon/fabicon.png') }}" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* ADDED BACKGROUND IMAGE HERE */
        body { 
            display: flex;
            justify-content: center; 
            align-items: center; 
            background: url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center fixed; 
            background-size: cover;
            min-height: 100vh;
            margin: 0;
        } 
        .auth-box { background: rgba(59, 13, 19, 0.95); padding: 40px; border-radius: 10px; border-top: 4px solid #FFD700; box-shadow: 0 15px 40px rgba(0,0,0,0.9); text-align: center; width: 90%; max-width: 400px; }
        .auth-box h2 { color: #FFD700; margin-bottom: 25px; text-transform: none; letter-spacing: 0; border-bottom: none; margin-top: 0; }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(20, 2, 5, 0.9); border: 1px solid rgba(255, 215, 0, 0.5); border-radius: 6px; color: white; outline: none; font-size: 1rem; transition: 0.3s; box-sizing: border-box;}
        .auth-input:focus { border-color: #FFD700; box-shadow: 0 0 8px rgba(255,215,0,0.3); }
        .auth-input::placeholder { color: #aaa; }
        .auth-btn { background-color: #FFD700; color: #800000; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; font-size: 1rem; margin-top: 5px; text-transform: none;}
        .auth-btn:hover { transform: translateY(-2px); background-color: #ffea75; }
        .auth-links { margin-top: 25px; font-size: 0.9rem; color: #ddd; display: flex; flex-direction: column; gap: 10px;}
        .auth-links a { color: #FFD700; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .auth-links a:hover { color: #fff; }
        .error { background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; color: #ffcccc; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- READABILITY: Inter font, comfortable sizes --- */
        html { font-size: 16px; }
        body, button, input, select, textarea { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
        body { font-size: 1rem; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    </style>
</head>
<body>
    <div class="auth-box">
        
        <!-- ADDED LOGO HERE -->
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="School Logo" style="width: 110px; height: 110px; object-fit: cover; border-radius: 50%; border: 3px solid #FFD700; margin-bottom: 15px;">
        
        <h2>Student Login</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="error">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="lrn" class="auth-input" placeholder="12-Digit LRN" required>
            <input type="password" name="password" class="auth-input" placeholder="Password" required>
            <button type="submit" class="auth-btn">Log In</button>
        </form>
        
        <div class="auth-links">
            <div>Don't have an account? <a href="{{ url_for('register') }}">Sign up here</a></div>
            <div style="margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                <a href="{{ url_for('teacher_login') }}" style="color: #aaa; font-weight: normal;">Faculty / Teacher Login</a>
            </div>
        </div>
    </div>
</body>
</html>
